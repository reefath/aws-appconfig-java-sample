buildscript {
    repositories {
      maven {
        url "https://plugins.gradle.org/m2/"
      }
      mavenCentral()
    }
    dependencies {
        classpath('org.springframework.boot:spring-boot-gradle-plugin:3.5.16')
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'springio'


repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Security patch overrides of Spring Boot managed transitive dependencies (kept in sync with pom.xml)
ext['byte-buddy.version'] = '1.18.17'
ext['jackson-bom.version'] = '2.21.9'
ext['tomcat.version'] = '10.1.62'
ext['logback.version'] = '1.5.38'
ext['netty.version'] = '4.1.141.Final'
ext['log4j2.version'] = '2.26.1'

dependencies {
    implementation files('movie-service-utils/built-library/0_1_0/movie-service-utils-0.1.0.jar')
    implementation("org.springframework.boot:spring-boot-starter-web")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    implementation platform('software.amazon.awssdk:bom:2.59.10')
    implementation 'software.amazon.awssdk:appconfig'
    implementation("org.json:json:20260814")
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
